[package]
name = "ourlogins-app"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
description = "Our Logins desktop app (Tauri shell around the ourlogins library)"
license = "MIT"

[[bin]]
name = "OurLogins"
path = "src/main.rs"

[features]
# Always embed web/dist in the binary, so plain `cargo build --release` yields the single exe.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ourlogins = { path = ".." }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Text only: the default "image-data" feature pulls image decoders this app never uses.
arboard = { version = "3.7", default-features = false }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
global-hotkey = "0.9"
zeroize = "1"
tauri-plugin-single-instance = "2"
# Signed updates from the GitHub release feed (updater.rs; plugins.updater in tauri.conf.json).
tauri-plugin-updater = "2"
# tauri::generate_context! emits serde_json for the plugins.updater config.
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
# Same versions wry uses; needed to switch off WebView2 autofill and password autosave.
webview2-com = "0.39"
# Quick unlock (biometric.rs): Windows Hello key credential; SHA-256 and AES-256-GCM from BCrypt.
# Auto-lock (autolock.rs): session-lock notifications.
windows = { version = "0.62", features = [
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
# IAsyncOperation; `windows` 0.62 depends on this crate but does not re-export it.
windows-future = "0.3"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Quick unlock (biometric.rs): login Keychain plus a Touch ID check through LAContext.
# Auto-lock (autolock.rs): sleep and screen-lock notifications.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# tests/updater_config.rs: checks the updater public key in tauri.conf.json (both already in Cargo.lock).
base64 = "0.22"
minisign-verify = "0.3"
