[package]
name = "ourlogins-app"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Our Logins desktop app (Tauri shell around the ourlogins library)"
license = "MIT"

[[bin]]
name = "OurLogins"
path = "src/main.rs"

[features]
# Always embed web/dist in the binary, so plain `cargo build --release` yields the single exe.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ourlogins = { path = ".." }
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Text only: the default "image-data" feature pulls image decoders this app never uses.
arboard = { version = "3.7", default-features = false }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
global-hotkey = "0.9"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
# Same versions wry uses; needed to switch off WebView2 autofill and password autosave.
webview2-com = "0.39"
windows-core = "0.62"
# Quick unlock (biometric.rs): Windows Hello key credential; SHA-256 and AES-256-GCM from BCrypt.
windows = { version = "0.62", features = [
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Quick unlock (biometric.rs): login Keychain plus a Touch ID check through LAContext.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
