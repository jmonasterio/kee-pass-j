name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisories, banned sources, duplicates (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
      - name: npm advisories
        run: npm audit --audit-level=low
      - name: Dependency count does not grow
        # Raise these only on purpose, in the same commit that adds the dependency.
        run: |
          cargo_max=572; npm_max=77
          cargo_n=$(grep -c '^name = ' Cargo.lock)
          npm_n=$(grep -c '"node_modules/' package-lock.json)
          echo "Cargo.lock packages: $cargo_n (max $cargo_max); package-lock entries: $npm_n (max $npm_max)"
          [ "$cargo_n" -le "$cargo_max" ] && [ "$npm_n" -le "$npm_max" ]

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Test
        # After the frontend: the app crate embeds web/dist at compile time.
        run: cargo test --workspace
      - name: Bundle universal "Our Logins.app", DMG and signed update archive
        # beforeBuildCommand (npm run build) runs inside tauri build; ad-hoc signed via bundle.macOS.signingIdentity "-".
        # createUpdaterArtifacts adds "Our Logins.app.tar.gz" and its .sig, signed with the updater key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Stable name
        run: |
          mkdir -p dist
          bundle=target/universal-apple-darwin/release/bundle
          cp $bundle/dmg/*.dmg dist/OurLogins-macos-universal.dmg
          cp "$bundle/macos/Our Logins.app.tar.gz" dist/OurLogins-macos-universal.app.tar.gz
          cp "$bundle/macos/Our Logins.app.tar.gz.sig" dist/OurLogins-macos-universal.app.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: OurLogins-macos-universal
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Test
        # After the frontend: the app crate embeds web/dist at compile time.
        run: cargo test --workspace
      - name: Build single exe and per-user installer
        # The updater installs only through the NSIS installer (per user, no admin prompt); the
        # bare exe stays for people who run it from a folder of their choice.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npx tauri build --bundles nsis
          mkdir dist
          copy target\release\OurLogins.exe dist\OurLogins-windows-x64.exe
          copy target\release\bundle\nsis\*-setup.exe dist\OurLogins-windows-x64-setup.exe
          copy target\release\bundle\nsis\*-setup.exe.sig dist\OurLogins-windows-x64-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with:
          name: OurLogins-windows-x64
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Test
        # After the frontend: the app crate embeds web/dist at compile time.
        run: cargo test --workspace
      - name: Bundle AppImage and .deb
        # beforeBuildCommand (npm run build) runs inside tauri build; createUpdaterArtifacts signs the AppImage.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles appimage,deb
      - name: Stable names
        # Fixed file names, so releases/latest/download/<name> links keep working across versions.
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/OurLogins-linux-x86_64.AppImage
          cp target/release/bundle/appimage/*.AppImage.sig dist/OurLogins-linux-x86_64.AppImage.sig
          cp target/release/bundle/deb/*.deb dist/OurLogins-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: OurLogins-linux-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Update feed (latest.json)
        # Read by the app's updater from releases/latest/download/latest.json (tauri.conf.json).
        run: |
          node scripts/update-feed.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist > dist/latest.json
          cat dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latest.json
            dist/OurLogins-macos-universal/OurLogins-macos-universal.dmg
            dist/OurLogins-macos-universal/OurLogins-macos-universal.app.tar.gz
            dist/OurLogins-windows-x64/OurLogins-windows-x64.exe
            dist/OurLogins-windows-x64/OurLogins-windows-x64-setup.exe
            dist/OurLogins-linux-x86_64/OurLogins-linux-x86_64.AppImage
            dist/OurLogins-linux-x86_64/OurLogins-linux-amd64.deb

  site-links:
    # keypass.argw.com links to releases/latest/download/<name>: fails (and GitHub emails) when a
    # release renames or drops a file the download page still links to.
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Every download link on keypass.argw.com resolves
        run: |
          links=$(curl -sf https://keypass.argw.com/ | grep -o 'https://github.com/[^"]*/releases/latest/download/[^"]*' | sort -u)
          [ -n "$links" ] || { echo "no download links found on the page"; exit 1; }
          bad=0
          for u in $links; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "$u")
            echo "$code $u"
            case "$code" in 200|206) ;; *) bad=1 ;; esac
          done
          exit $bad
