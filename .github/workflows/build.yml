name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p ourlogins --lib
      - name: Frontend
        run: |
          npm ci
          npm run check
      - name: Bundle universal "Our Logins.app"
        # beforeBuildCommand (npm run build) runs inside tauri build; ad-hoc signed via bundle.macOS.signingIdentity "-".
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "target/universal-apple-darwin/release/bundle/macos/Our Logins.app" dist/OurLogins-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OurLogins-macos-universal
          path: dist/OurLogins-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p ourlogins --lib
      - name: Frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Build single exe
        run: cargo build --release -p ourlogins-app
      - uses: actions/upload-artifact@v4
        with:
          name: OurLogins-windows-x64
          path: target/release/OurLogins.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OurLogins-macos-universal/OurLogins-macos-universal.zip
            dist/OurLogins-windows-x64/OurLogins.exe
