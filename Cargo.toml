[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "ourlogins"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "KDBX password manager library: vault, generator, settings, Auto-Type"
license = "MIT"

[lib]
name = "ourlogins"
path = "src/lib.rs"

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
thiserror = "2"
global-hotkey = "0.9"
zeroize = "1"

# Keystrokes and the foreground window title (src/input.rs). Same `windows` version as the
# app crate, so only one copy is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
enigo = "0.6"

# Versions already in the macOS build through tauri and enigo.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }

[dev-dependencies]
tempfile = "3"
# Unoptimized crypto and gzip make debug builds unusable: Argon2 unlock takes tens of
# seconds, and saving a 14 MB database took 4.1 s instead of 1.0 s. Optimize every
# dependency; the workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
