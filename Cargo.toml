[package]
name = "keepassj"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "KDBX password manager with a capture-first UI, Auto-Type, and rolling backups"
license = "MIT"
build = "build.rs"

[lib]
name = "keepassj"
path = "src/lib.rs"

[[bin]]
name = "keepassj"
path = "src/main.rs"

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
slint = "1.18"
rfd = "0.17"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
thiserror = "2"
enigo = "0.6"
global-hotkey = "0.9"
active-win-pos-rs = "0.11"
zeroize = "1"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
# Argon2/AES/ChaCha unoptimized make unlock take tens of seconds in debug builds.
[profile.dev.package.rust-argon2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.keepass]
opt-level = 3


[profile.release]
opt-level = 3
lto = "thin"
strip = true
