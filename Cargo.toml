[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "ourlogins"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "KDBX password manager library: vault, generator, settings, Auto-Type"
license = "MIT"

[lib]
name = "ourlogins"
path = "src/lib.rs"

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
thiserror = "2"
enigo = "0.6"
global-hotkey = "0.9"
active-win-pos-rs = "0.11"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# Unoptimized crypto and gzip make debug builds unusable: Argon2 unlock takes tens of
# seconds, and saving a 14 MB database took 4.1 s instead of 1.0 s. Optimize every
# dependency; the workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
